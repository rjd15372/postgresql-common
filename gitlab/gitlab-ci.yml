# gitlab-ci.yml file for the Debian PostgreSQL packages
# to be used in debian/gitlab-ci.yml:
# include: https://salsa.debian.org/postgresql/postgresql-common/raw/master/gitlab/gitlab-ci.yml

include:
  - https://salsa.debian.org/salsa-ci-team/pipeline/raw/master/salsa-ci.yml
  - https://salsa.debian.org/salsa-ci-team/pipeline/raw/master/pipeline-jobs.yml

variables:
  PG_UPDATECONTROL: 'yes' # tell pg_buildext to automatically generate debian/control from debian/control.in (TODO: doesn't work this way yet)
  SALSA_CI_DISABLE_REPROTEST: true # too many packages fail because reprotest runs the build as root, disable for now
  SALSA_CI_REPROTEST_ENABLE_DIFFOSCOPE: true
  SALSA_CI_DISABLE_CROSSBUILD_ARM64: true # clang isn't ready for cross-building yet
  SALSA_CI_DISABLE_BUILD_PACKAGE_I386: true # extensions disable 32-bit builds by default
